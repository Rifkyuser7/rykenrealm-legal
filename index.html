<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RykenRealm — Legal Center</title>
<style>
  :root {
    --bg: #080808; 
    --card-bg: #111111; 
    --text: #f0f0f0; 
    --muted: #777777; 
    --border: #222222; 
    --hover-border: #ffffff;
    --code-bg: #050505;
    --code-text: #a8a8a8;
    --code-highlight: #ffffff;
  }
  [data-theme="light"] {
    --bg: #f2f2f7; 
    --card-bg: #ffffff; 
    --text: #111111; 
    --muted: #666666; 
    --border: #e0e0e0; 
    --hover-border: #000000;
    --code-bg: #fafafa;
    --code-text: #555555;
    --code-highlight: #000000;
  }

  * { box-sizing: border-box; transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease, transform 0.2s ease; }
  
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow-x: hidden; padding: 20px;
  }

  .card {
    max-width: 500px; width: 100%; padding: 36px 28px; text-align: center;
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3); position: relative;
    opacity: 0; transform: translateY(15px);
    animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes fadeInUp {
    to { opacity: 1; transform: translateY(0); }
  }

  /* Header Judul & Tombol Kontrol yang Sejajar Rapi */
  .header-section {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 20px; text-align: left;
  }

  .title-group h1 {
    font-size: 26px; margin: 0 0 4px; font-weight: 700; letter-spacing: -0.5px;
  }
  
  .title-group p.sub { color: var(--muted); margin: 0; font-size: 13px; font-weight: 400; }

  .controls-group {
    display: flex; gap: 6px; flex-shrink: 0;
  }

  .btn-toggle {
    background: transparent; border: 1px solid var(--border); color: var(--text);
    padding: 6px 10px; font-size: 11px; font-weight: 600; border-radius: 10px; cursor: pointer;
    letter-spacing: 0.5px;
  }
  .btn-toggle:hover { border-color: var(--hover-border); transform: scale(1.05); }

  /* Kotak Terminal Kode (C++ & HTML Mix) */
  .code-preview {
    background: var(--code-bg); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px; text-align: left; margin-bottom: 20px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 12px; position: relative; overflow: hidden;
  }

  .code-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
    border-bottom: 1px solid var(--border); padding-bottom: 6px; color: var(--muted);
  }

  .code-dots { display: flex; gap: 5px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); }

  .code-body {
    color: var(--code-text); line-height: 1.5; min-height: 40px;
  }
  .code-body span { color: var(--code-highlight); font-weight: 600; }

  /* Tombol Dokumen */
  .links { display: flex; flex-direction: column; gap: 10px; }
  
  a.doc-link {
    display: block; padding: 14px 18px; border-radius: 12px;
    background: var(--bg); border: 1px solid var(--border);
    color: var(--text); text-decoration: none; font-weight: 600; font-size: 14px;
    text-align: left; position: relative;
  }
  
  a.doc-link:hover {
    border-color: var(--hover-border);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
  }

  a.doc-link span { 
    display: block; font-weight: 400; color: var(--muted); font-size: 11px; margin-top: 2px; 
  }
  
  footer { 
    margin-top: 24px; color: var(--muted); font-size: 11px; 
    border-top: 1px solid var(--border); padding-top: 16px; 
  }
  footer a { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
  footer a:hover { opacity: 0.7; }
</style>
</head>
<body>
  <div class="card">
    <!-- Header dengan Layout Sejajar Rapi -->
    <div class="header-section">
      <div class="title-group">
        <h1 id="title">RykenRealm</h1>
        <p class="sub" id="subtitle">Dokumen resmi bot Discord</p>
      </div>
      <div class="controls-group">
        <button class="btn-toggle" id="langBtn" onclick="toggleLang()">EN</button>
        <button class="btn-toggle" id="themeBtn" onclick="toggleTheme()">Light</button>
      </div>
    </div>
    
    <!-- Elemen Preview Kode Interaktif (C++ & HTML Mix) -->
    <div class="code-preview">
      <div class="code-header">
        <div class="code-dots">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
        <span id="codeLangLabel">core.cpp &bull; html</span>
      </div>
      <div class="code-body" id="typingCode">
        <span>#include &lt;iostream&gt;</span><br>
        std::string bot = "RykenRealm"; // Secured
      </div>
    </div>

    <div class="links">
      <a class="doc-link" id="tosLink" href="./terms-of-service.html">
        Terms of Service
        <span id="tosDesc">Ketentuan penggunaan bot</span>
      </a>
      <a class="doc-link" id="ppLink" href="./privacy-policy.html">
        Privacy Policy
        <span id="ppDesc">Kebijakan privasi &amp; data pengguna</span>
      </a>
    </div>

    <footer>
      Owner &amp; Dev: Rizuki (@ryin.r) &middot; <a href="https://discord.gg/kME469thr6">Server Discord</a>
    </footer>
  </div>

  <script>
    let currentLang = 'id';
    let currentTheme = 'dark';

    const codeSnippets = [
      '<span>#include &lt;iostream&gt;</span><br>std::string bot = "RykenRealm"; // Optimized',
      '<span>&lt;html lang=&quot;id&quot;&gt;</span><br>&lt;head&gt;&lt;title&gt;Legal&lt;/title&gt;&lt;/head&gt;',
      '<span>void initializeCore()</span><br>{ system("RykenRealm.exe --secure"); }'
    ];
    let codeIndex = 0;
    setInterval(() => {
      codeIndex = (codeIndex + 1) % codeSnippets.length;
      const codeBox = document.getElementById('typingCode');
      codeBox.style.opacity = '0';
      setTimeout(() => {
        codeBox.innerHTML = codeSnippets[codeIndex];
        codeBox.style.opacity = '1';
      }, 300);
    }, 4000);

    function toggleTheme() {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', currentTheme);
      document.getElementById('themeBtn').textContent = currentTheme === 'dark' ? 'Light' : 'Dark';
    }

    function toggleLang() {
      currentLang = currentLang === 'id' ? 'en' : 'id';
      const langBtn = document.getElementById('langBtn');
      const subtitle = document.getElementById('subtitle');
      const tosLink = document.getElementById('tosLink');
      const ppLink = document.getElementById('ppLink');
      const tosDesc = document.getElementById('tosDesc');
      const ppDesc = document.getElementById('ppDesc');

      if (currentLang === 'en') {
        langBtn.textContent = 'ID';
        subtitle.textContent = 'Official Discord bot documents';
        tosLink.href = './terms-of-service-en.html';
        ppLink.href = './privacy-policy-en.html';
        tosDesc.textContent = 'Bot usage terms & conditions';
        ppDesc.textContent = 'User privacy policy & data handling';
      } else {
        langBtn.textContent = 'EN';
        subtitle.textContent = 'Dokumen resmi bot Discord';
        tosLink.href = './terms-of-service.html';
        ppLink.href = './privacy-policy.html';
        tosDesc.textContent = 'Ketentuan penggunaan bot';
        ppDesc.textContent = 'Kebijakan privasi & data pengguna';
      }
    }
  </script>
</body>
  </html>
