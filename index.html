<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RykenRealm — Legal Documents</title>
<style>
  :root {
    --bg: #0a0a0a; 
    --card-bg: #141414; 
    --text: #ededed; 
    --muted: #888888; 
    --border: #262626; 
    --hover-border: #ffffff;
  }
  [data-theme="light"] {
    --bg: #f5f5f7; 
    --card-bg: #ffffff; 
    --text: #171717; 
    --muted: #666666; 
    --border: #e0e0e0; 
    --hover-border: #000000;
  }

  * { box-sizing: border-box; transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease, transform 0.2s ease; }
  
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow-x: hidden;
  }

  /* Animasi Masuk (Fade Up) */
  .card {
    max-width: 480px; width: 90%; padding: 40px 32px; text-align: center;
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2); position: relative;
    opacity: 0; transform: translateY(20px);
    animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes fadeInUp {
    to { opacity: 1; transform: translateY(0); }
  }

  .top-controls {
    display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 24px;
  }
  
  .btn-toggle {
    background: transparent; border: 1px solid var(--border); color: var(--text);
    padding: 6px 14px; font-size: 12px; font-weight: 500; border-radius: 20px; cursor: pointer;
  }
  .btn-toggle:hover { border-color: var(--hover-border); transform: scale(1.05); }

  h1 {
    font-size: 32px; margin: 0 0 8px; font-weight: 700; letter-spacing: -0.5px;
    color: var(--text);
  }
  
  p.sub { color: var(--muted); margin: 0 0 32px; font-size: 14px; font-weight: 400; }
  
  .links { display: flex; flex-direction: column; gap: 14px; }
  
  a.doc-link {
    display: block; padding: 18px 22px; border-radius: 12px;
    background: var(--bg); border: 1px solid var(--border);
    color: var(--text); text-decoration: none; font-weight: 600; font-size: 15px;
    text-align: left; position: relative; overflow: hidden;
  }
  
  /* Efek interaktif saat kursor diarahkan */
  a.doc-link:hover {
    border-color: var(--hover-border);
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  }

  a.doc-link span { 
    display: block; font-weight: 400; color: var(--muted); font-size: 12px; margin-top: 4px; 
  }
  
  footer { 
    margin-top: 36px; color: var(--muted); font-size: 12px; 
    border-top: 1px solid var(--border); padding-top: 20px; 
  }
  footer a { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
  footer a:hover { opacity: 0.7; }
</style>
</head>
<body>
  <div class="card">
    <div class="top-controls">
      <button class="btn-toggle" id="langBtn" onclick="toggleLang()">EN</button>
      <button class="btn-toggle" id="themeBtn" onclick="toggleTheme()">Light</button>
    </div>

    <h1 id="title">RykenRealm</h1>
    <p class="sub" id="subtitle">Dokumen resmi untuk bot Discord RykenRealm</p>
    
    <div class="links">
      <a class="doc-link" id="tosLink" href="./terms-of-service.html">
        Terms of Service
        <span id="tosDesc">Ketentuan penggunaan bot</span>
      </a>
      <a class="doc-link" id="ppLink" href="./privacy-policy.html">
        Privacy Policy
        <span id="ppDesc">Kebijakan privasi &amp; data pengguna</span>
      </a>
    </div>

    <footer>
      Owner &amp; Dev: Rizuki (@ryin.r) &middot; <a href="https://discord.gg/kME469thr6">Server Discord</a>
    </footer>
  </div>

  <script>
    let currentLang = 'id';
    let currentTheme = 'dark';

    function toggleTheme() {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', currentTheme);
      document.getElementById('themeBtn').textContent = currentTheme === 'dark' ? 'Light' : 'Dark';
    }

    function toggleLang() {
      currentLang = currentLang === 'id' ? 'en' : 'id';
      const langBtn = document.getElementById('langBtn');
      const subtitle = document.getElementById('subtitle');
      const tosLink = document.getElementById('tosLink');
      const ppLink = document.getElementById('ppLink');
      const tosDesc = document.getElementById('tosDesc');
      const ppDesc = document.getElementById('ppDesc');

      if (currentLang === 'en') {
        langBtn.textContent = 'ID';
        subtitle.textContent = 'Official documentation for RykenRealm Discord bot';
        tosLink.href = './terms-of-service-en.html';
        ppLink.href = './privacy-policy-en.html';
        tosDesc.textContent = 'Bot usage terms & conditions';
        ppDesc.textContent = 'User privacy policy & data handling';
      } else {
        langBtn.textContent = 'EN';
        subtitle.textContent = 'Dokumen resmi untuk bot Discord RykenRealm';
        tosLink.href = './terms-of-service.html';
        ppLink.href = './privacy-policy.html';
        tosDesc.textContent = 'Ketentuan penggunaan bot';
        ppDesc.textContent = 'Kebijakan privasi & data pengguna';
      }
    }
  </script>
</body>
</html>
