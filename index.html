<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RykenRealm — Legal Documents</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #131826; --text: #dbe2f0; --muted: #8a93a8;
    --accent: #7c5cff; --accent2: #22d3ee; --border: #232a3d;
  }
  [data-theme="light"] {
    --bg: #f8fafc; --panel: #ffffff; --text: #1e293b; --muted: #64748b;
    --accent: #6366f1; --accent2: #0ea5e9; --border: #e2e8f0;
  }
  * { box-sizing: border-box; transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card { max-width: 480px; width: 90%; padding: 36px 28px; text-align: center; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); position: relative; }
  
  .top-controls {
    display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 20px;
  }
  .btn-toggle {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 6px 12px; font-size: 12px; font-weight: 600; border-radius: 8px; cursor: pointer;
  }
  .btn-toggle:hover { border-color: var(--accent2); }

  h1 {
    font-size: 32px; margin: 0 0 6px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p.sub { color: var(--muted); margin: 0 0 28px; font-size: 14px; }
  
  .links { display: flex; flex-direction: column; gap: 12px; }
  a.doc-link {
    display: block; padding: 16px 20px; border-radius: 10px;
    background: var(--bg); border: 1px solid var(--border);
    color: var(--text); text-decoration: none; font-weight: 600; font-size: 15px;
    text-align: left;
  }
  a.doc-link:hover { border-color: var(--accent2); transform: translateY(-1px); }
  a.doc-link span { display: block; font-weight: 400; color: var(--muted); font-size: 12px; margin-top: 4px; }
  
  footer { margin-top: 30px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--border); padding-top: 20px; }
  footer a { color: var(--accent2); text-decoration: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="top-controls">
      <button class="btn-toggle" id="langBtn" onclick="toggleLang()">EN</button>
      <button class="btn-toggle" id="themeBtn" onclick="toggleTheme()">☀️ Light</button>
    </div>

    <h1 id="title">RykenRealm</h1>
    <p class="sub" id="subtitle">Dokumen resmi untuk bot Discord RykenRealm</p>
    
    <div class="links">
      <a class="doc-link" id="tosLink" href="./terms-of-service.html">
        Terms of Service
        <span id="tosDesc">Ketentuan penggunaan bot</span>
      </a>
      <a class="doc-link" id="ppLink" href="./privacy-policy.html">
        Privacy Policy
        <span id="ppDesc">Kebijakan privasi &amp; data pengguna</span>
      </a>
    </div>

    <footer>
      Owner &amp; Dev: Rizuki (@ryin.r) &middot; <a href="https://discord.gg/kME469thr6">Server Discord</a>
    </footer>
  </div>

  <script>
    let currentLang = 'id';
    let currentTheme = 'dark';

    function toggleTheme() {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', currentTheme);
      document.getElementById('themeBtn').textContent = currentTheme === 'dark' ? '☀️ Light' : '🌙 Dark';
    }

    function toggleLang() {
      currentLang = currentLang === 'id' ? 'en' : 'id';
      const langBtn = document.getElementById('langBtn');
      const subtitle = document.getElementById('subtitle');
      const tosLink = document.getElementById('tosLink');
      const ppLink = document.getElementById('ppLink');
      const tosDesc = document.getElementById('tosDesc');
      const ppDesc = document.getElementById('ppDesc');

      if (currentLang === 'en') {
        langBtn.textContent = 'ID';
        subtitle.textContent = 'Official documentation for RykenRealm Discord bot';
        tosLink.href = './terms-of-service-en.html';
        ppLink.href = './privacy-policy-en.html';
        tosDesc.textContent = 'Bot usage terms & conditions';
        ppDesc.textContent = 'User privacy policy & data handling';
      } else {
        langBtn.textContent = 'EN';
        subtitle.textContent = 'Dokumen resmi untuk bot Discord RykenRealm';
        tosLink.href = './terms-of-service.html';
        ppLink.href = './privacy-policy.html';
        tosDesc.textContent = 'Ketentuan penggunaan bot';
        ppDesc.textContent = 'Kebijakan privasi & data pengguna';
      }
    }
  </script>
</body>
        </html>
